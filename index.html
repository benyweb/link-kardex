<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>کاردکس لینک‌ها</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./Css/style.css">
<script>
  /* Apply saved theme before first paint to avoid a flash of the wrong theme. */
  (function(){
    try{
      var t = localStorage.getItem('benyweb-link-kardex:theme');
      if(t === 'dark' || t === 'light'){
        document.documentElement.setAttribute('data-theme', t);
      }
    }catch(e){}
  })();
</script>
</head>
<body>
<div class="shell">

  <header class="top">
    <div class="brand">
      <h1>کاردکس لینک‌ها</h1>
      <p>بایگانیِ شخصیِ لینک‌هات — سریع اضافه کن، سریع پیدا کن.</p>
    </div>
    <div class="header-side">
      <div class="stats" id="stats"></div>
      <button class="theme-toggle" id="themeToggle" type="button" title="تغییر پوسته" aria-label="تغییر بین حالت روشن و تاریک">
        <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4.5"/><path d="M12 2.5v2.2M12 19.3v2.2M4.2 4.2l1.6 1.6M18.2 18.2l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.2 19.8l1.6-1.6M18.2 5.8l1.6-1.6"/></svg>
        <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a6.8 6.8 0 0 0 10.5 10.5z"/></svg>
      </button>
    </div>
  </header>

  <div class="toolbar">
    <div class="search-wrap">
      <input type="text" class="search" id="search" placeholder="جستجو در عنوان، توضیح، دسته یا برچسب… ( / )">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    </div>
    <select class="sort" id="sortSel">
      <option value="new">جدیدترین</option>
      <option value="old">قدیمی‌ترین</option>
      <option value="az">الفبایی</option>
    </select>
    <button class="btn" id="openAddBtn">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      لینک جدید
    </button>
    <button class="btn ghost sm" id="importBookmarksBtn">درون‌ریزی از بوکمارک مرورگر</button>
    <button class="btn ghost sm" id="exportBtn">خروجی JSON</button>
    <button class="btn ghost sm" id="importJsonBtn">درون‌ریزی JSON</button>
    <input type="file" id="fileNetscape" accept=".html,.htm">
    <input type="file" id="fileJson" accept=".json">
  </div>

  <div id="formZone"></div>

  <div class="grid">
    <aside class="cats">
      <h3>دسته‌بندی‌ها</h3>
      <div id="catList"></div>
    </aside>
    <main class="list">
      <div id="listZone"></div>
    </main>
  </div>

  <footer class="site-footer">
    <div class="footer-credit">
      <div class="footer-seal" aria-hidden="true">BW</div>
      <p>
        ساخته‌شده با  توسط تیم
        <a href="https://benyweb.ir/" target="_blank" rel="noopener">بنی‌وب</a>
        — کدش متن‌باز است و روی
        <a href="https://github.com/benyweb/link-kardex" target="_blank" rel="noopener">گیت‌هاب</a>
        در دسترس همه قرار دارد.
      </p>
    </div>
    <div class="footer-socials">
      <a class="social-btn" href="https://benyweb.ir/" target="_blank" rel="noopener" title="وب‌سایت بنی‌وب" aria-label="وب‌سایت بنی‌وب">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3c2.6 2.6 4 5.7 4 9s-1.4 6.4-4 9c-2.6-2.6-4-5.7-4-9s1.4-6.4 4-9z"/></svg>
      </a>
      <a class="social-btn" href="mailto:benyweb.ir@gmail.com" title="ایمیل" aria-label="ایمیل بنی‌وب">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m4 7 8 6 8-6"/></svg>
      </a>
      <a class="social-btn" href="https://t.me/Benyweb_Channel" target="_blank" rel="noopener" title="کانال تلگرام" aria-label="کانال تلگرام بنی‌وب">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m21 4-19 8 6 2 2 6 3-4 5 4 3-16z"/><path d="M8 14 19 5"/></svg>
      </a>
      <a class="social-btn" href="https://www.linkedin.com/in/benyweb/" target="_blank" rel="noopener" title="لینکدین" aria-label="لینکدین بنی‌وب">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="7.5" y1="10" x2="7.5" y2="17"/><circle cx="7.5" cy="6.8" r="1"/><path d="M11.5 17v-4.2c0-1.5 1-2.3 2.2-2.3s2.1.8 2.1 2.3V17"/><line x1="11.5" y1="10" x2="11.5" y2="17"/></svg>
      </a>
      <a class="social-btn" href="https://instagram.com/official_benyweb" target="_blank" rel="noopener" title="اینستاگرام" aria-label="اینستاگرام بنی‌وب">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.2" cy="6.8" r="0.6" fill="currentColor" stroke="none"/></svg>
      </a>
      <a class="social-btn" href="https://github.com/benyweb" target="_blank" rel="noopener" title="گیت‌هاب" aria-label="گیت‌هاب بنی‌وب">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 19c-4.3 1.4-4.3-2.5-6-3m12 5v-3.4c0-1 .1-1.4-.5-2 2-.2 4.5-1 4.5-4.5a3.5 3.5 0 0 0-1-2.5 3.3 3.3 0 0 0-.1-2.5s-.9-.3-2.9 1a10 10 0 0 0-5.2 0c-2-1.3-2.9-1-2.9-1a3.3 3.3 0 0 0-.1 2.5 3.5 3.5 0 0 0-1 2.5c0 3.5 2.5 4.3 4.5 4.5-.6.6-.6 1.2-.5 2V21"/></svg>
      </a>
    </div>
    <p class="footer-fine">© بنی‌وب — تمام حقوق کد برای جامعهٔ متن‌باز محفوظ است.</p>
  </footer>

</div>

<div class="toast" id="toast"></div>

<script src="./JavaScript/script.js" defer></script>
</body>
</html>
